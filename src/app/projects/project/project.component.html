<div class="project-div">
    <div class="project-img">
      <img [src]="imageSrc" alt="Project Image">
    </div>
    <div class="project-info">
      <h3>{{ title }}</h3>
      <p>{{ description }}</p>
      <div class="stack">
        @for (stackName of stack; track stackName) {
          <div class="stack-div">
            <p>{{stackName}}</p>
          </div>
        }
      </div>
      <div class="source">
        <a [href]="codeLink" target="_blank" class="cover">
          <h4>Code</h4>
          <div class="img-div">
            <img src="../../assets/images/github-cyan.svg" alt="GitHub Logo">
          </div>
        </a>
        @if(demoLink){
          <a [href]="demoLink" target="_blank" class="cover">
            <h4>Live Demo</h4>
            <div class="img-div">
              <img src="../../assets/images/project-images/new-tab-cyan.svg" alt="Live Demo Logo">
            </div>
          </a>
        }
      </div>
    </div>
  </div>
